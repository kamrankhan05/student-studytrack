<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyTrack | Student Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <main class="page-shell">

    <!--  AUTH VIEW  -->
    <!-- Shown when no user is signed in. Holds signup + login forms. -->
    <section id="authView" class="auth-view">

      <h1 class="app-title">StudyTrack</h1>
      <p class="app-subtitle">Student task and assignment manager</p>

      <form id="loginForm" class="auth-form">
        <h2>Log In</h2>

        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="loginEmail" required />

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="loginPassword" required minlength="6" />

        <button type="submit">Log In</button>

        <p class="auth-switch">
          Don't have an account?
          <button type="button" id="showSignup" class="link-button">Sign Up</button>
        </p>
      </form>

      <form id="signupForm" class="auth-form hidden">
        <h2>Sign Up</h2>

        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" name="signupEmail" required />

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" name="signupPassword" required minlength="6" />

        <button type="submit">Create Account</button>

        <p class="auth-switch">
          Already have an account?
          <button type="button" id="showLogin" class="link-button">Log In</button>
        </p>
      </form>

      <!-- Shared message area for auth success/error feedback -->
      <div id="authMessage" class="message-area" role="status"></div>

    </section>

    <!--  APP VIEW  -->
    
    <section id="appView" class="app-view hidden">

      <header class="app-header">
        <h1 class="app-title">StudyTrack</h1>
        <button type="button" id="logoutButton" class="secondary-button">Log Out</button>
      </header>

      <section id="statsGrid" class="stats-grid">
        <!-- 4 summary cards: total, pending, completed, overdue -->
        <!-- We'll build these in the CSS/stats stage -->
      </section>

      <div class="dashboard-grid">
        <form id="taskForm" class="task-form">
          <!-- title, subject, description, due_date, priority, status -->
        </form>

        <div>
          <section id="filterBar" class="filter-bar">
            <!-- search input, status filter, priority filter -->
          </section>

          <section id="taskList" class="task-list">
            <!-- task cards rendered by app.js -->
          </section>
        </div>
      </div>

      <div id="appMessage" class="message-area" role="status"></div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
