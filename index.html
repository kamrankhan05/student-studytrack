<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <main class="page-shell">

    <!-- Auth View -->

    <section id="authView" class="auth-view">

      <h1 class="web-title">Studytrack</h1>
      <p class="web-subtitle">Student task and assignment manager</p>

      <!-- Login And Signup -->

      <form id="loginForm">
        <h2>Log In</h2>

        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="loginEmail" required>

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="loginPassword" required minlength="8">

        <button type="submit">Log In</button>

        <!-- Switch TO Signup -->

        <p class="auth-switch">
          Dont have an account?
          <button type="button" id="showSignup" class="link-button">Sign Up</button>
        </p>
      </form>

      <!-- Sign Up Form -->

      <form id="signupForm" class="auth-form hidden">
        <h2>Sign Up</h2>

        <label for="signupEmial" >Email</label>
        <input type="email" id="signupEmail" name="signupEmail" required>

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" name="signupPassword" required minlength="8">

        <button type="submit">Create Account</button>

        <!-- If Already account Switch -->

        <p class="auth-switch">
          Already have an account?

          <button type="button" id="showLogin" class="link-button">Log In</button>
        </p>

      </form>

      <!-- shared message area for success or error feedback -->

      <div id="authMessage" class="message-area" role="status"></div>
      
    </section>
  
</body>
</html>
